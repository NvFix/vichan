upstream php-upstream {
	server php:9000;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server ipv6only=on;
	server_name vichan;
	root /var/www/html;

	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	index index.html index.php;

	charset utf-8;

	# Block access to hidden/dot files (e.g. .installed, .git, .env)
	location ~ /\. {
		deny all;
		return 404;
	}

	# Block access to database dumps, config files, and repository metadata
	location ~* \.(sql|ya?ml|log|bak|swp)$ {
		deny all;
		return 404;
	}

	# Block direct web access to backend PHP code, templates, and CLI tools
	location ^~ /inc/ {
		deny all;
		return 404;
	}

	location ^~ /templates/ {
		deny all;
		return 404;
	}

	location ^~ /tools/ {
		deny all;
		return 404;
	}

	# Prevent execution of PHP scripts in user upload / media directories
	location ~ ^/.+/(src|thumb)/.*\.php$ {
		deny all;
		return 404;
	}

	location ~ ^([^.\?]*[^\/])$ {
		try_files $uri @addslash;
	}

	# Direct live serving for theme assets (Schizou CSS & logo)
	location = /schizou.css {
		alias /code/templates/themes/schizou/schizou.css;
		expires -1;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
	}

	location = /schizou_logo.png {
		alias /code/templates/themes/schizou/schizou_logo.png;
		expires -1;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
	}

	location = /favicon.png {
		alias /code/templates/themes/schizou/SchizoFavicon.png;
		expires -1;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
	}

	location ^~ /stylesheets/ {
		root /code;
		expires -1;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
	}

	# Expire rules for static content
	# Media: images, icons, video, audio, HTC
	location ~* \.(?:jpg|jpeg|gif|png|webp|bmp|ico|cur|gz|svg|svgz|mp4|mkv|ogg|ogv|webm|mp3|pdf|txt|htc)$ {
		expires -1;
		access_log off;
		log_not_found off;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, must-revalidate";
	}
	# CSS and Javascript
	location ~* \.(?:css|js)$ {
		expires -1;
		access_log off;
		log_not_found off;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, must-revalidate";
	}

	location = / {
		expires -1;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
		try_files /index.html /index.php$is_args$args;
	}

	location ~* \.(html)$ {
		expires -1;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
	}

	location @addslash {
		return 301 $uri/;
	}

	location / {
		try_files $uri $uri/ /index.php$is_args$args;
	}

	client_max_body_size 2G;

	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_pass php-upstream;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME /var/www/$fastcgi_script_name;
		fastcgi_param HTTPS $fcgi_https;
		fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
		fastcgi_read_timeout 600;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }
}
