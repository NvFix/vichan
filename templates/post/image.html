<a href="{{ config.uri_img }}{{ post.file }}" target="_blank"{% if post.thumb == 'file' or post.modifiers['is_file'] == '1' or post.file|extension in ['webm', 'mp4', 'mkv'] or post.filename|extension in ['webm', 'mp4', 'mkv'] %} class="file"{% endif %}>{% if post.thumb|extension in ['webm', 'mp4', 'mkv'] %}<video autoplay class="post-image" src="{{ config.uri_thumb }}{{ post.thumb }}" poster="{{ config.root }}{% if config.file_icons[post.file|extension] %}{{ config.file_thumb|sprintf(config.file_icons[post.file|extension]) }}{% elseif config.file_icons[post.filename|extension] %}{{ config.file_thumb|sprintf(config.file_icons[post.filename|extension]) }}{% else %}{{ config.file_thumb|sprintf(config.file_icons.default) }}{% endif %}" style="width:{{ post.thumbwidth }}px;height:{{ post.thumbheight }}px" {% if config.content_lazy_loading %}loading="lazy"{% endif %}></video>{% else %}<img class="post-image" src="{% if post.thumb == 'file' %}{{ config.root }}{% if config.file_icons[post.file|extension] %}{{ config.file_thumb|sprintf(config.file_icons[post.file|extension]) }}{% elseif config.file_icons[post.filename|extension] %}{{ config.file_thumb|sprintf(config.file_icons[post.filename|extension]) }}{% else %}{{ config.file_thumb|sprintf(config.file_icons.default) }}{% endif %}{% elseif post.thumb == 'spoiler' %}{{ config.root }}{{ config.spoiler_image }}{% else %}{{ config.uri_thumb }}{{ post.thumb }}{% endif %}" style="width:{{ post.thumbwidth }}px;height:{{ post.thumbheight }}px" {% if config.content_lazy_loading %}loading="lazy"{% endif %} alt="" />{% endif %}</a>
